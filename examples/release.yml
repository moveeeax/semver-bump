# Example consumer workflow: on every push to main, work out the next version
# from Conventional Commits and, when there is something to release, create the
# tag and updated changelog. Drop this into .github/workflows/ of your repo.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semver-bump needs full history and tags

      - id: bump
        uses: moveeeax/semver-bump@v1
        with:
          tag: "true"

      - name: Push the new tag
        if: steps.bump.outputs.has-changes == 'true'
        run: git push origin ${{ steps.bump.outputs.next-tag }}
